<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
</head>
<style>
    div{
        background: linear-gradient(blue,lightblue);
        display:flex;
        flex-direction: column;
        width: 300px;
        height: 280px;
        border-radius: 10px;
        padding: 10px;
        margin:10px;
        gap:10px;

    }
    h3{
        text-align: center;
        font-family: 'Courier New', Courier, monospace;
    }
    .SignUp{
        border-radius: 20px;
        gap: 10px;
        padding: 10px;
        width: 200px;
    }
        button{
            border-radius: 20px;
            color: black;
            background-color: blue;
            padding: 10px;
            font-weight: bold;
            width: 220px;
            cursor: pointer;
            align-items: center;
        }
        button:hover{
            background-color: lightseagreen;
            color: blue;
        }        
        #id2{
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
            margin-left: 4px;


        }
        
            
        
        #id2:hover{
            text-decoration: underline;

        }
        input{
            align-items: left;
            padding-left: 2px;
            font-size: small;

        }
        label{
            font-size: 14px;
            margin-right: 8px;
            vertical-align: middle;
        }
        form{
            display: flex;
            align-items: center;
            gap: 20px;
        }
        a{
            text-align: right;
            font-size: 14px;
            text-decoration: none;
        }
        a:hover{
            text-decoration: underline;
        }
</style>
<body>
    <div>
        <h3>Sign In</h3>
        <input  class="SignUp"placeholder="Enter your username" type="email">
        <input class="SignUp"placeholder="Enter your password" type="password">
        
        
        <form>
        <label>
        <input type="checkbox">Remember me
        </label>
        <a href="#">Forgot password?</a>
        </form>
        <button>LOGIN</button>
        <p id="id1">Don't have an account?</span>
        <a href="#"id="id2">Sign Up</a>
        </p>
    </div>
</body>
</html>
